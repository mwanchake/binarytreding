databases:
  - name: binarytreding-postgres
    databaseName: binarytreding
    user: binarytreding
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: binarytreding-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: binarytreding-realtime
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.echo
    dockerContext: .
    envVars:
      - key: APP_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: binarytreding-redis
          property: connectionString

  - type: web
    name: binarytreding-market-data
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.tradingview-proxy
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false

  - type: web
    name: binarytreding-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PASSPORT_PRIVATE_KEY
        sync: false
      - key: PASSPORT_PUBLIC_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: binarytreding-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: binarytreding-redis
          property: connectionString
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: BROADCAST_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: ECHO_SERVER_HOST
        fromService:
          type: web
          name: binarytreding-realtime
          property: host
      - key: ECHO_SERVER_PORT
        value: "443"
      - key: WEBSOCKET_HOST
        fromService:
          type: web
          name: binarytreding-market-data
          property: host
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false

  - type: worker
    name: binarytreding-order-checks
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan check:orders
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: binarytreding-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: binarytreding-redis
          property: connectionString
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: BROADCAST_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

  - type: worker
    name: binarytreding-scheduler
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan schedule:work
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: binarytreding-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: binarytreding-redis
          property: connectionString
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: BROADCAST_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

  - type: worker
    name: binarytreding-quotes
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan tradingview:start
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: binarytreding-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: binarytreding-redis
          property: connectionString
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: BROADCAST_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: TRADINGVIEW_LOGIN
        sync: false
      - key: TRADINGVIEW_PASSWORD
        sync: false
